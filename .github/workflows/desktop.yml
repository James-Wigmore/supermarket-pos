name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm ci --prefix desktop
      - name: Run release checks
        run: npm run check
      - name: Match tag to app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = node -p "require('./desktop/package.json').version"
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) { throw "Release tag must match desktop/package.json version ($expectedTag)." }
      # Add CSC_LINK / CSC_KEY_PASSWORD as repository secrets to sign the installer (optional).
      # Installed apps look for updates in this repository's GitHub Releases (it must stay public), so the
      # installer is built with this repository as its update source and latest.yml is released next to it.
      # A manual run builds the TEST installer (own data folder, never updates) so it can be tried safely.
      # Only a pushed v* tag builds the real installer that users receive through updates.
      - run: npm run ${{ startsWith(github.ref, 'refs/tags/v') && 'desktop:package' || 'desktop:test' }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          UPDATE_FEED_REPO: ${{ github.repository }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/v') && 'Supermarket-POS-Setup' || 'Supermarket-POS-TEST-Setup' }}
          path: |
            desktop/release/*Setup.exe
            desktop/release/latest.yml
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            desktop/release/Supermarket-POS-Setup.exe
            desktop/release/latest.yml
          fail_on_unmatched_files: true
